# One row per session for /v1/sessions/{id} -- same column set as sessions_in_range, scoped by
# id instead of a timeframe.
session_detail: |
  SELECT s.session_id, s.user_id, s.agent, s.agent_version, s.status, s.started_at,
         s.last_event_at, s.ended_at, i.models, i.tools, i.files, i.skills, i.subagents,
         i.turns, i.turn_count, i.long_turn_count, i.tokens_total, i.compaction_count,
         i.subagent_count, i.error_count, i.info, i.otel, i.cost_effective_usd_micros,
         i.datasource, i.jsonl_lag_s
  FROM sessions s
  JOIN session_info i ON i.session_id = s.session_id
  WHERE s.session_id = :session_id;

# ------------------------------------------------------------ S1 rhythm zone (R1)

# One row per calendar day that had a session, for one user, over a rolling window. Powers the
# 52-week heatmap and the streak walk (service.py computes streaks/active-days in Python from
# these rows -- no SQL window functions, FEAS §6).
#
# `sessions` counts roots only -- FEAS §4/R0's same asymmetry, same reason: a sub-agent shares
# its parent's calendar day (so the *day* is identical either way) but would double the day's
# *session count* if left in. `tokens` sums every row -- own-session tokens are never rolled
# up into the parent anywhere in the system, same as `sessions_in_range`.
#
# Tokens must resolve in every mode (FEAS §7b): `i.tokens_total` is written only by the JSONL
# fold and is 0 on every `otel_only` row, so summing it alone would render an empty heatmap for
# an OTel-only deployment. The CASE below mirrors the *top* of `precedence.py`'s tokens chain
# (otel_measures, then jsonl_models) in SQL, reading the four pre-summed `otel.tokens.*`
# scalars rather than the per-request ledger. It deliberately **omits the `otel_ledger` rung**
# -- reachable only by a ledger-only fleet with no metrics pipeline; document that omission
# here rather than let it be discovered. If this ever drifts from `precedence.py`, the
# two-mode fixture in the rhythm tests catches it.
#
# Availability is keyed on `i.otel->'measures'` being non-empty, **not** `i.otel->'tokens'`
# existing -- that key is always present with zero defaults (`precedence.py`'s own documented
# trap, `_otel_measures_tokens`). Values are plain decimal strings (`_fmt`,
# otel_trueup.py:148), so they cast via `::numeric`, not `::bigint`.
#
# `:tz` is the user's IANA zone name (`users.timezone`, resolved by the caller via
# `single_user/service.py::_resolve_tz` -- `'UTC'` when no preference is set, same day
# boundary as before this column existed). `timezone(text, timestamptz)` -- the function form,
# not the `AT TIME ZONE` operator -- because it takes its zone as an ordinary bind parameter.
#
# No index on `sessions.started_at` today -- the `user_id` index carries this scan at v1,
# single-user scale (FEAS §6); a composite `(user_id, started_at)` is the fleet-scale follow-up.
activity_by_day: |
  SELECT timezone(:tz, s.started_at)::date AS day,
         count(*) FILTER (WHERE s.parent_session_id IS NULL) AS sessions,
         sum(
           CASE
             WHEN COALESCE(i.otel->'measures', '{}'::jsonb) <> '{}'::jsonb
               THEN COALESCE((i.otel->'tokens'->>'tokens_input')::numeric, 0)
                  + COALESCE((i.otel->'tokens'->>'tokens_output')::numeric, 0)
                  + COALESCE((i.otel->'tokens'->>'tokens_cache_read')::numeric, 0)
                  + COALESCE((i.otel->'tokens'->>'tokens_cache_creation')::numeric, 0)
             ELSE i.tokens_total
           END
         ) AS tokens
  FROM sessions s
  JOIN session_info i ON i.session_id = s.session_id
  WHERE s.user_id = :user_id
    AND s.started_at >= :from
  GROUP BY 1
  ORDER BY 1;

# `/rhythm`'s own mode block (envelope rule 1) -- kept as a second, separate query rather than
# folded into `activity_by_day` above so that query stays exactly what its name says (one row
# per day) and this one stays a trivial single-digit-row aggregate over the same window. Same
# root-only counting as `sessions_in_range`/`activity_by_day` (FEAS §4/R0).
rhythm_modes_in_window: |
  SELECT i.datasource, count(*) FILTER (WHERE s.parent_session_id IS NULL) AS sessions
  FROM sessions s
  JOIN session_info i ON i.session_id = s.session_id
  WHERE s.user_id = :user_id
    AND s.started_at >= :from
  GROUP BY i.datasource;

# ------------------------------------------------------------------ TZ track: timezone preference

get_user_timezone: |
  SELECT timezone FROM users WHERE user_id = :user_id;

# Upsert, not a bare UPDATE: the single-user surface's own `id` (today, always the literal
# viewer placeholder `"me"` -- viewer.tsx's own comment, pending real auth) has no guarantee a
# `users` row exists yet -- that row is normally created by telemetry ingest
# (ingest.yaml's `upsert_user_*`) or directory sync, neither of which a demo/local single-user
# deployment necessarily has for this id. Same insert-if-absent shape as `upsert_user_github_login`.
set_user_timezone: |
  INSERT INTO users (user_id, timezone, info, created_at)
  VALUES (:user_id, :timezone, '{}'::jsonb, now())
  ON CONFLICT (user_id) DO UPDATE SET timezone = EXCLUDED.timezone
  RETURNING user_id, timezone;

# ------------------------------------------------------------------ A8/R9: feedback (one of two
# writes this module makes -- everything else in this file is read-only).

session_exists: |
  SELECT 1 FROM sessions WHERE session_id = :session_id;

insert_feedback: |
  INSERT INTO feedback (session_id, beat_ref, verdict, created_at)
  VALUES (:session_id, :beat_ref, :verdict, now())
  RETURNING id, created_at;
