# OTLP vendor mapping for Claude Code (spec: docs/design/2026-08-04-otel-intake-design.md §4.6).
# All vendor knowledge lives in files like this one -- receiver and fold are vendor-blind, and
# adding an agent is adding a file here, not a code change (D-OT6). Written against a recorded
# dump (client v2.1.219), not documentation; see tests/fixtures/otel/README.md.
vendor: claude_code

# Match rules are OR'd: any one hit claims the payload. Files are evaluated in filename order,
# first match wins. Two rules rather than one because the signals disagree -- metrics arrive
# under scope `com.anthropic.claude_code`, log events under `com.anthropic.claude_code.events`
# -- and because a fleet can rename `service.name` but not the SDK's scope.
detect:
  scope_name_prefix: "com.anthropic.claude_code"
  service_name_prefix: "claude-code"

identity:
  session_attr: "session.id"
  # First present wins. Ordered most-stable to least: the account UUID survives an email
  # change, `user.id` is a per-install hash and the last resort.
  user_attrs: ["user.account_uuid", "user.email", "user.id"]

events:
  # v1 keeps the one event carrying `request_id` + cost -- the join key to JSONL (D-OT2).
  # Everything else is counted and dropped; widening this list is a config change, not code.
  accept: ["api_request"]
  request_event: "api_request"
  # canonical column <- vendor attribute. Anything not named here rides `attrs` as residue.
  fields:
    request_id: "request_id"
    model: "model"
    input_tokens: "input_tokens"
    output_tokens: "output_tokens"
    cache_read_tokens: "cache_read_tokens"
    cache_creation_tokens: "cache_creation_tokens"
    cost_usd_micros:
      - attr: "cost_usd_micros"
      # Clients older than v2.1.219 emit only the float (design §8).
      - attr: "cost_usd"
        scale: 1000000
    duration_ms: "duration_ms"
    query_source: "query_source"
    prompt_id: "prompt.id"
    event_ts: "event.timestamp"

# canonical measure <- vendor metric (+ label selector). What the true-up fold groups by, so
# no vendor metric name reaches the worker.
measures:
  tokens_input:           {metric: "claude_code.token.usage", where: {type: "input"}}
  tokens_output:          {metric: "claude_code.token.usage", where: {type: "output"}}
  tokens_cache_read:      {metric: "claude_code.token.usage", where: {type: "cacheRead"}}
  tokens_cache_creation:  {metric: "claude_code.token.usage", where: {type: "cacheCreation"}}
  cost_usd:               {metric: "claude_code.cost.usage"}
  active_time_s:          {metric: "claude_code.active_time.total"}
  # Background-call split (dashboard-datasource-modes plan PM.3): the only path to "what are
  # background calls costing me" in a metrics-only fleet, where there is no request ledger to
  # split by query_source instead (otel_trueup.py's `_by_query_source`). `where` only matches
  # equality (mapping.py MeasureSelector.selects), and the recorded dump shows exactly two
  # `query_source` label values on these datapoints -- `main` (interactive) and `auxiliary`
  # (background) -- so an enumerated match covers it without a negation operator.
  # TODO(dashboard): if a client ever emits a third query_source value on this label, this
  # needs either selector-language negation or another enumerated line.
  tokens_input_bg:          {metric: "claude_code.token.usage", where: {type: "input", query_source: "auxiliary"}}
  tokens_output_bg:         {metric: "claude_code.token.usage", where: {type: "output", query_source: "auxiliary"}}
  tokens_cache_read_bg:     {metric: "claude_code.token.usage", where: {type: "cacheRead", query_source: "auxiliary"}}
  tokens_cache_creation_bg: {metric: "claude_code.token.usage", where: {type: "cacheCreation", query_source: "auxiliary"}}
  cost_usd_bg:              {metric: "claude_code.cost.usage", where: {query_source: "auxiliary"}}

# Metrics with no canonical measure yet -- session.count, lines_of_code.count,
# code_edit_tool.decision -- are still stored as series and points; they simply do not fold
# into the cost block. Promoting one is adding a line above, not a migration.
