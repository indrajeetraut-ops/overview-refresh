# The whole Organization shifts half its usage to the cheaper model of each agent
# (same changes as team3-cheaper-models, declared at the Organization: every team and
# project moves the same 50%).
schema: scenario/1.0
name: org-cheaper-models
scope:
  type: organization
changes:
  - model_transfer:
      from: claude-opus-5
      to: claude-sonnet-5
      fraction: 0.5
      token_factor: 1.0
  - model_transfer:
      from: gpt-5.6-sol
      to: gpt-5.6-terra
      fraction: 0.5
      token_factor: 1.0
