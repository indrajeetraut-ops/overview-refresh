# Usage level of the QA team over the series: a test-cycle crunch at the start (shared with
# Development), a small bump, and a second test-cycle crunch about three quarters in.
# Bound in ../series.yaml (`curve.teams`). See development-phases.yaml for the axis, the why and
# the regeneration command. QA has 5 people, so a realised crunch week varies a lot with the
# end date (absent users), and its forecast band is wide whatever the curve: the second crunch
# is kept to 1.4x so that QA's p90 stays below about 170% of its budget at any end date.
#   p 1-5    level 1.7 (days 0-8)    test cycle shared with Development; ramps to 1.0 by p 7
#   p 20-22  level 1.15 (days 38-42) bump
#   p 41-44  level 1.4 (days 79-86)  test-cycle crunch, inside the last 60 days of the series
#   p 47-61  within +/-4% of 1.0     quiet
schema_version: 1
name: qa-phases
interp: pchip
axis: {start: 1, end: 61}
anchors:
  - [1, "1.700"]
  - [5, "1.700"]
  - [7, "1.000"]
  - [18, "1.000"]
  - [20, "1.150"]
  - [22, "1.150"]
  - [24, "1.000"]
  - [39, "1.000"]
  - [41, "1.400"]
  - [44, "1.400"]
  - [46, "1.000"]
  - [47, "1.040"]
  - [53, "0.960"]
  - [61, "1.000"]
preview:
  days: 120
  baseline_tokens: 1000000
description: "QA team usage level: test cycle at the start, bump, 1.4x test cycle, quiet end"
