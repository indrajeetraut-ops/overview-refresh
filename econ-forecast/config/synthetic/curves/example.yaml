schema_version: 1
name: q3-ramp-and-plateau
interp: pchip
axis: {start: 1, end: 14}
anchors:                     # [pos, "value"]; value is a STRING: signed = delta, unsigned = absolute
  - [1,  "10"]                # absolute base
  - [5,  "-0.5"]               # delta down  -> 9.5
  - [6,  "-0.8"]               # delta down  -> 8.7
  - [7,  "+4"]                 # delta up    -> 12.7
  - [14, "12"]                 # absolute    -> 12.0
preview:
  days: 60
  baseline_tokens: 1000000
description: "ramp up then gentle decline"
