# Synthetic generator configuration. See src/forecast/synthetic/README.md.
# The CLI requires a new --output directory and writes a stage report.
schema_version: 3
# Reuse users and roster. Changing series length never regenerates them.
series:
  # Paths are relative to this YAML file.
  users_file: ../../artifacts/users/users.jsonl
  roster_file: ../../artifacts/roster/teams.jsonl
  # Inclusive start date and number of calendar days.
  start_date: '2026-07-01'
  days: 60
  timezone: Asia/Kolkata
  # Fixes one light/mid/heavy profile per user for the entire series.
  profile_seed: 100
  # Independent streams for activity, Project, volume, spikes, and token mix.
  usage_seed: 123
# Ratios use 0..1. *_pct is relative percent; *_pp is percentage points.
defaults:
  # 30 means baseline multiplied by a uniform factor between 0.70 and 1.30.
  daily_variation_pct: 30
  output_ratio: 0.03
  cache_hit_ratio: 0.95
  # An 80% cache-hit ratio with 5 points varies between 75% and 85%.
  cache_hit_variation_pp: 5
  cache_write_ratio: 0.997       # share of non-cache-read input that is a cache write
  cache_write_1h_share: 0.97     # share of cache writes at the 1-hour lifetime
  # Perturb positive agent/model weights relatively, then normalize.
  mix_variation_pct: 10
  daily_zero_probability: 0.1
  # No weekend drop by default: weekend_reduction_probability defaults to 0.
  # Opt in with e.g. weekend_reduction_probability: 0.6, weekend_reduction_factor: 0.25
  # (see examples/synthetic/weekend-drop.yaml).
# Per-user total processed input on an ACTIVE weekday (input + cache_read).
# Output is additional; daily totals are not model context-window limits.
profiles:
  light_profile:
    daily_input_tokens: 250000
  mid_profile:
    daily_input_tokens: 1000000
  heavy_profile:
    daily_input_tokens: 5000000
# Profile mix gives fixed user counts; Project mix is sampled per active day.
# One team per project (design §1): each Project appears in exactly one Team's mix.
# Ordinary daily inactivity (and opt-in weekend reduction) may be overridden per Team.
team_profiles:
  team1:
    profile_mix:
      light_profile: 0.8
      heavy_profile: 0.2
    project_mix:
      payment_service_improvement: 0.7
      auth_service_rewrite: 0.3
  team2:
    profile_mix:
      light_profile: 0.4
      mid_profile: 0.4
      heavy_profile: 0.2
    project_mix:
      data_pipeline_upgrade: 0.6
      search_service_improvement: 0.4
  team3:
    profile_mix:
      light_profile: 0.2
      mid_profile: 0.4
      heavy_profile: 0.4
    project_mix:
      developer_tooling: 1.0
projects:
- name: payment_service_improvement
- name: auth_service_rewrite
- name: data_pipeline_upgrade
- name: search_service_improvement
- name: developer_tooling
# API only. Each user-day total is allocated once across agents, then models.
# Adding a model does not multiply the daily baseline.
agents:
  claude:
    billing_mode: api
    usage_share: 0.6
    models:
      claude-sonnet-5: 0.75
      claude-opus-5: 0.25
  codex:
    billing_mode: api
    usage_share: 0.4
    models:
      gpt-5.6-terra: 0.75
      gpt-5.6-sol: 0.25
# Date-level spike rules and explicit zero periods. Coverage remains complete on zero days.
# Omit date_range to use the full series. Weekends and zero baseline rows never spike.
events:
  spike_rules:
  - id: default-spike
    probability: 0.02
    multiplier_min: 3.0
    multiplier_max: 5.0
    targets:
      teams: []
      agents: []
      models: []
  zero_periods: []
