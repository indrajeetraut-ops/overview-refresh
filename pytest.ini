[pytest]
pythonpath = . src tests econ-forecast/src
# importlib import mode: the repo has an `analysis` package in both src/ and tests/, which under
# the default prepend mode lets tests/analysis shadow src/analysis (any test importing analysis.*
# from outside tests/analysis then fails to resolve submodules). importlib avoids sys.path
# manipulation and resolves each module by its configured location. Full non-slow suite verified.
addopts = --import-mode=importlib
testpaths = tests econ-forecast/tests
markers =
    slow: starts real servers, restarts them, or waits out a real timeout.
        The fast path is `-m "not slow"`; anything marked here must still be
        deterministic, just not cheap.
